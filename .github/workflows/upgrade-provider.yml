name: Upgrade provider
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Upstream release to upgrade to, e.g. v3.8.6 (default latest)
        required: false

  schedule:
    - cron: "0 5 * * *"

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # Not pulumi/upgrade-provider: upstream tags v3.x while its go.mod still
  # declares the /v2 module path, which that tool cannot resolve. See
  # scripts/upgrade-upstream.sh.
  upgrade_provider:
    name: upgrade-provider
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      - name: Install Pulumi CLI
        uses: pulumi/actions@v7
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags
        shell: bash
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 11
      - name: Setup DotNet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.300
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: "Set up git identity"
        run: |
          git config --global user.name 'eliobischof'
          git config --global user.email 'eliobischof@users.noreply.github.com'
        shell: bash
      - name: Upgrade upstream provider
        run: ./scripts/upgrade-upstream.sh
        shell: bash
        env:
          # Opening the PR needs "Allow GitHub Actions to create and approve pull
          # requests" enabled for GITHUB_TOKEN, or an UPGRADE_PR_TOKEN secret (a PAT
          # with pull request write access) where that setting is unavailable.
          GH_TOKEN: ${{ secrets.UPGRADE_PR_TOKEN || env.GH_TOKEN }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PR_REVIEWERS: eliobischof
